<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

body {
font: 15px/1.5 sans-serif;
background: #1c1c1e;
color: #f2f2f2;
margin: 0;
    }
main {
max-width: 680px;
margin: 0 auto;
padding: 20px 16px;
    }

/* Conversation list row */
.row {
display: block;
padding: 12px 14px;
background: #2c2c2e;
border: 1px solid #3a3a3c;
border-radius: 8px;
margin-bottom: 8px;
text-decoration: none;
color: inherit;
    }

.row .name {
font-weight: 600;
    }

/* Message bubbles in a thread */
.msg {
background: #2c2c2e;
border-radius: 10px;
padding: 8px 12px;
max-width: 75%;
margin-bottom: 10px;
}

a {
    color: #58a6ff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

</style>
</head>
<body>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
