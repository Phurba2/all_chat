{% extends "base.html" %}
{% block content %}

<a href="{% url 'inbox' %}">&larr; inbox</a>

<div>
  
  {% for m in thread %}

  <div class="msg">
    {% if m.subject %}<strong>{{ m.subject }}</strong><br>{% endif %}
    {% if m.summary %}<p>{{ m.summary }}</p> {% endif %}
  </div>

  {% endfor %}
</div>

{% endblock %}
