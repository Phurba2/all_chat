<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Gmail – Unified Inbox</title>
<style>
  body {
    font: 15px/1.5 sans-serif;
    background: #1c1c1e;
    color: #f2f2f2;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    max-width: 400px;
    width: 100%;
    padding: 40px 32px;
    background: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 12px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px 0;
    text-align: center;
  }
  p {
    color: #a1a1a6;
    text-align: center;
    margin: 0 0 24px 0;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #a1a1a6;
    margin-bottom: 4px;
  }
  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    color: #f2f2f2;
    font-size: 15px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #58a6ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background: #4090e0;
  }
  .error {
    background: #ff453a22;
    border: 1px solid #ff453a;
    color: #ff6b6b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    text-align: center;
  }
  .skip {
    display: block;
    text-align: center;
    margin-top: 16px;
    color: #a1a1a6;
    font-size: 13px;
    text-decoration: none;
  }
  .skip:hover {
    color: #f2f2f2;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📬 Connect Gmail</h1>
    <p>Enter your Gmail address and an app password to sync your inbox.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@gmail.com" required autocomplete="off">

      <label for="password">App password</label>
      <input type="password" id="password" name="password" placeholder="xxxx xxxx xxxx xxxx" required autocomplete="off">

      <button type="submit">Connect &amp; Sync</button>
    </form>
  </div>
</body>
</html>
