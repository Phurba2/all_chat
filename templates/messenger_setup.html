<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Messenger – Unified Inbox</title>
<style>
  body {
    font: 15px/1.5 sans-serif;
    background: #1c1c1e;
    color: #f2f2f2;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    max-width: 400px;
    width: 100%;
    padding: 40px 32px;
    background: #2c2c2e;
    border: 1px solid #3a3a3c;
    border-radius: 12px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 8px 0;
    text-align: center;
  }
  p {
    color: #a1a1a6;
    text-align: center;
    margin: 0 0 24px 0;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #a1a1a6;
    margin-bottom: 4px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    color: #f2f2f2;
    font-size: 15px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #58a6ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover {
    background: #4090e0;
  }
  .error {
    background: #ff453a22;
    border: 1px solid #ff453a;
    color: #ff6b6b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    text-align: center;
  }
  .hint {
    margin-top: 16px;
    color: #a1a1a6;
    font-size: 12px;
    line-height: 1.6;
  }
  .hint code {
    color: #f2f2f2;
    background: #1c1c1e;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid #3a3a3c;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>💬 Connect Messenger</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="page_id">Page ID</label>
      <input type="text" id="page_id" name="page_id" placeholder="e.g. 123456789012345" value="{{ page_id }}" required autocomplete="off">

      <label for="access_token">Page Access Token</label>
      <input type="password" id="access_token" name="access_token" placeholder="EAAG..." value="{{ access_token }}" required autocomplete="off">

      <label for="graph_version">Graph API version</label>
      <input type="text" id="graph_version" name="graph_version" placeholder="v21.0" value="{{ graph_version }}" autocomplete="off">

      <label for="app_secret">App Secret</label>
      <input type="password" id="app_secret" name="app_secret" placeholder="Verify webhook payloads" value="{{ app_secret }}" autocomplete="off">

      <label for="verify_token">Verify Token</label>
      <input type="text" id="verify_token" name="verify_token" placeholder="Your webhook verify token" value="{{ verify_token }}" autocomplete="off">

      <button type="submit">Connect &amp; Sync</button>
    </form>

    <p class="hint">Page credentials stay in this browser. App Secret and Verify
      Token are stored server-side so Meta can verify the webhook at
      <code>/messenger/webhook/</code>.</p>
  </div>
</body>
</html>
